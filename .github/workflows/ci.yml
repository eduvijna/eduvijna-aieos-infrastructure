name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  opentofu-validate:
    name: opentofu-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5

      - name: Prove exact OpenTofu version
        run: |
          tofu version
          ver="$(tofu version -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["terraform_version"])')"
          test "$ver" = "1.12.5"

      - name: Secret / apply / local-state guards
        working-directory: .
        run: bash scripts/guard.sh

      - name: Format check
        working-directory: .
        run: tofu fmt -check -recursive

      - name: Init without backend (no production state)
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate

      - name: Prove enable_cloud_resources remains false by default
        working-directory: .
        run: |
          awk '/variable "enable_cloud_resources"/,/^}/' environments/production/variables.tf \
            | grep -E '^\s*default\s*=\s*false\s*$'

      - name: Prove lockfile pins DigitalOcean 2.99.1
        working-directory: .
        run: |
          test -f environments/production/.terraform.lock.hcl
          grep -q 'version.*=.*"2.99.1"' environments/production/.terraform.lock.hcl

      - name: Prove CI has no DigitalOcean token
        run: |
          if [ -n "${DIGITALOCEAN_TOKEN:-}" ]; then
            echo "DIGITALOCEAN_TOKEN must not be present in foundation CI" >&2
            exit 1
          fi

  postgresql-identity-bootstrap:
    name: postgresql-identity-bootstrap
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_bootstrap_only
          POSTGRES_DB: aieos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aieos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: aieos_ci
      PGUSER: postgres
      PGPASSWORD: ci_bootstrap_only
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Prove PostgreSQL major version 18
        run: |
          major="$(psql -Atqc "SELECT split_part(version(), ' ', 2)::int")"
          test "$major" = "18"

      - name: Secret / apply / local-state guards
        run: bash scripts/guard.sh

      - name: Run disposable identity bootstrap CI proof
        run: bash scripts/postgresql/ci-test-bootstrap.sh
